services:
  # 1. Worker Daemon: Mantiene los modelos en VRAM/GPU y atiende /embed y /rerank
  rag-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-local:latest
    container_name: rag-daemon
    restart: "no"
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command: ["python", "-m", "rag_local.daemon", "--port", "21239"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
      - DAEMON_IDLE_TIMEOUT=0
      - DAEMON_TOKEN=rag-local-internal-token
      - DAEMON_PORT=21239
      - DOCKER_CONTAINER=1
      - RAG_MODELS_DIR=/app/models
      - HF_HOME=/app/models/huggingface
      - TZ=America/Santiago
    ports:
      - "8000:8000"
      - "21239:21239"
    volumes:
      # Código fuente local en vivo
      - ./src:/app/src:ro
      # Volumen único para todos los modelos de Machine Learning
      - rag_models:/app/models
      # Base de datos global LanceDB de contratos de tipos y dependencias
      - rag_deps_db:/app/.cache/rag-local/dependencies
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import http.client; c=http.client.HTTPConnection('127.0.0.1',21239,timeout=2); c.request('GET','/health'); r=c.getresponse(); exit(0 if r.status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 2. Servidor FastMCP en modo SSE (HTTP Server en puerto 8000)
  rag-mcp:
    image: rag-local:latest
    container_name: rag-mcp
    restart: "no"
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command: ["rag-mcp"]
    network_mode: "service:rag-daemon"
    pid: "service:rag-daemon"
    depends_on:
      rag-daemon:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
      - DOCKER_CONTAINER=1
      - DAEMON_TOKEN=rag-local-internal-token
      - DAEMON_PORT=21239
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - RAG_REPO_ROOT=/workspaces
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RAG_MODELS_DIR=/app/models
      - HF_HOME=/app/models/huggingface
      - TZ=America/Santiago
    volumes:
      # Código fuente local en vivo
      - ./src:/app/src:ro
      # Bind Mount para repositorios de código del host
      - ${WORKSPACE_DIR:-..}:/workspaces
      # Acceso a modelos y base de datos de dependencias
      - rag_models:/app/models
      - rag_deps_db:/app/.cache/rag-local/dependencies
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  rag_models:
    name: rag_models
  rag_deps_db:
    name: rag_deps_db
