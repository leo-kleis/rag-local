services:
  # 1. Worker Daemon: Mantiene los modelos en VRAM/GPU y atiende /embed y /rerank
  rag-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-local:latest
    container_name: rag-daemon
    restart: "no"
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    command: ["python", "-m", "rag_local.daemon", "--port", "21239"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - DAEMON_IDLE_TIMEOUT=0
      - DAEMON_TOKEN=rag-local-internal-token
      - DAEMON_PORT=21239
      - DOCKER_CONTAINER=1
      - HF_HOME=/app/.cache/huggingface
      - TORCH_HOME=/app/.cache/torch
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - TZ=America/Santiago
    ports:
      - "8000:8000"
      - "21239:21239"
    volumes:
      # Código fuente local en vivo
      - ./src:/app/src:ro
      # Volúmenes nombrados ext4 para máximo rendimiento I/O en safetensors mmap
      - rag_models_cache:/app/.cache/huggingface
      - rag_torch_cache:/app/.cache/torch
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import http.client; c=http.client.HTTPConnection('127.0.0.1',21239,timeout=2); c.request('GET','/health'); r=c.getresponse(); exit(0 if r.status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 2. CLI / Servidor MCP: Cliente ligero (~150 MB RAM) que delega embeddings y reranking al daemon
  rag-local:
    image: rag-local:latest
    container_name: rag-local
    restart: "no"
    entrypoint: ["/usr/bin/tini", "-s", "--"]
    stdin_open: true
    tty: true
    network_mode: "service:rag-daemon"
    pid: "service:rag-daemon"
    depends_on:
      rag-daemon:
        condition: service_healthy
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - PYTHONUTF8=1
      - DOCKER_CONTAINER=1
      - DAEMON_TOKEN=rag-local-internal-token
      - DAEMON_PORT=21239
      - MCP_TRANSPORT=${MCP_TRANSPORT:-stdio}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - RAG_REPO_ROOT=/workspaces
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HF_HOME=/app/.cache/huggingface
      - TORCH_HOME=/app/.cache/torch
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - TZ=America/Santiago
    volumes:
      # Código fuente local en vivo
      - ./src:/app/src:ro
      # Bind Mount para repositorios de código: la base de datos .lancedb/ se guarda dentro de cada proyecto en el disco del host
      - ${WORKSPACE_DIR:-..}:/workspaces
      # Base de datos global de contratos de dependencias en almacenamiento nativo ext4
      - rag_deps_cache:/app/.cache/rag-local
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  rag_deps_cache:
    name: rag_deps_cache
  rag_models_cache:
    name: rag_models_cache
  rag_torch_cache:
    name: rag_torch_cache
