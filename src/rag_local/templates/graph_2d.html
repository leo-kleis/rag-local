<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evitar caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Grafo 2D (Cytoscape.js) — RAG Local</title>
    <!-- Cargar Cytoscape.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }
        .title { 
            height: 50px;
            padding: 8px 20px; 
            color: white; 
            background-color: #1e293b; 
            border-bottom: 1px solid #334155; 
            font-size: 1.25rem; 
            font-weight: bold;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        #search-box {
            background: #0b0f19;
            border: 1px solid #334155;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
            width: 220px;
            transition: border-color 0.15s;
        }
        #search-box:focus {
            border-color: #6366f1;
        }
        .checkbox-label {
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-label input {
            cursor: pointer;
            margin: 0;
        }
        #status {
            font-size: 0.85rem;
            color: #10b981;
            font-weight: 500;
        }
        #cy { 
            flex: 1;
            width: 100%;
            background-color: #0b0f19;
            box-sizing: border-box;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="title">
        <span>Visualización 2D (Cytoscape.js)</span>
        <div class="controls">
            <input type="text" id="search-box" placeholder="Buscar archivo o símbolo...">
            <label class="checkbox-label">
                <input type="checkbox" id="toggle-symbols">
                <span>Mostrar Símbolos e Imports (+2000 nodos)</span>
            </label>
            <span id="status">Visualización: Lista</span>
        </div>
    </div>
    <div id="cy"></div>
    <script>
        // Datos inyectados de forma limpia pre-calculados en Python
        const allElements = __GRAPH_ELEMENTS__;
        const onlyFilesElements = __ONLY_FILES_ELEMENTS__;

        let cyInstance;

        function initGraph(elements, isSymbolMode) {
            if (cyInstance) {
                cyInstance.destroy();
            }

            document.getElementById('status').textContent = "Calculando estructura del grafo...";
            document.getElementById('status').style.color = '#fbbf24';

            cyInstance = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'background-color': 'data(color)',
                            'label': 'data(shortLabel)',
                            'color': '#f8fafc',
                            'font-size': '10px',
                            'width': 'data(size)',
                            'height': 'data(size)',
                            'border-width': 1.5,
                            'border-color': '#334155',
                            'text-valign': 'center',
                            'text-halign': 'right',
                            'text-margin-x': 5,
                            'text-background-opacity': 0.6,
                            'text-background-color': '#0b0f19',
                            'text-background-padding': '2px',
                            'text-background-shape': 'roundrectangle',
                            'transition-property': 'opacity, border-color, border-width, background-color',
                            'transition-duration': '0.15s'
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 1.2,
                            'line-color': '#475569',
                            'target-arrow-color': '#475569',
                            'target-arrow-shape': 'triangle',
                            'curve-style': isSymbolMode ? 'haystack' : 'bezier', // haystack para máximo rendimiento en miles de nodos
                            'opacity': 0.4,
                            'transition-property': 'opacity, line-color, width',
                            'transition-duration': '0.15s'
                        }
                    },
                    {
                        selector: 'node.highlighted',
                        style: {
                            'border-color': '#6366f1',
                            'border-width': 3,
                            'background-color': '#4f46e5',
                            'z-index': 9999
                        }
                    },
                    {
                        selector: 'edge.highlighted',
                        style: {
                            'line-color': '#6366f1',
                            'target-arrow-color': '#6366f1',
                            'width': 2.5,
                            'opacity': 1.0,
                            'z-index': 9998
                        }
                    },
                    {
                        selector: 'node.faded',
                        style: {
                            'opacity': 0.15
                        }
                    },
                    {
                        selector: 'edge.faded',
                        style: {
                            'opacity': 0.05
                        }
                    }
                ],
                // Concentric para el modo completo de 2000 nodos (carga instantánea sin bloquear)
                // Cose para el modo simplificado de 85 archivos (diseño orgánico fluido)
                layout: {
                    name: isSymbolMode ? 'concentric' : 'cose',
                    fit: true,
                    padding: 60,
                    animate: false,
                    numIter: isSymbolMode ? 100 : 150
                }
            });

            cyInstance.ready(function() {
                document.getElementById('status').textContent = "Visualización: Lista";
                document.getElementById('status').style.color = '#10b981';
            });

            // Registrar hover interactivo
            cyInstance.on('mouseover', 'node', function(evt) {
                const node = evt.target;
                const neighborhood = node.neighborhood();
                
                cyInstance.elements().addClass('faded');
                node.removeClass('faded').addClass('highlighted');
                neighborhood.removeClass('faded');
                neighborhood.edges().removeClass('faded').addClass('highlighted');
                
                document.getElementById('status').textContent = `Archivo: ${node.data('fullName')}`;
                document.getElementById('status').style.color = '#60a5fa';
            });

            cyInstance.on('mouseout', 'node', function() {
                cyInstance.elements().removeClass('faded').removeClass('highlighted');
                document.getElementById('status').textContent = "Visualización: Lista";
                document.getElementById('status').style.color = '#10b981';
            });
        }

        // Cargar por defecto solo archivos (instantáneo, 85 nodos con layout cose impecable)
        initGraph(onlyFilesElements, false);

        // Controlar toggle del modo de símbolos
        document.getElementById('toggle-symbols').addEventListener('change', function(e) {
            initGraph(e.target.checked ? allElements : onlyFilesElements, e.target.checked);
        });

        // Controlar buscador
        document.getElementById('search-box').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            if (query === '') {
                cyInstance.elements().removeClass('faded');
            } else {
                cyInstance.elements().forEach(ele => {
                    const name = ele.isNode() ? ele.data('fullName') : '';
                    if (ele.isNode() && name.toLowerCase().includes(query)) {
                        ele.removeClass('faded');
                        ele.neighborhood().removeClass('faded');
                    } else {
                        ele.addClass('faded');
                    }
                });
            }
        });
    </script>
</body>
</html>
