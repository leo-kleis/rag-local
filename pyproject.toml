[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Reglas habilitadas por defecto
# E: pycodestyle errors
# F: Pyflakes (errores comunes)
# I: isort (ordenar imports)
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyrefly]
project-includes = [
    "src/**/*.py*",
    "src/**/*.ipynb",
]
project-excludes = [
    "**/.venv/**",
    "**/node_modules/**",
    "**/.git/**",
]
