[project]
name = "rag-local"
version = "0.5.1"
description = "Sistema RAG local con LanceDB"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "leo-kleis" }]
requires-python = ">=3.12"
keywords = ["rag", "lancedb", "embeddings", "mcp", "code-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "google-genai==2.8.0",
    "lancedb==0.33.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "rich==15.0.0",
    "tree-sitter==0.25.2",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-html==0.23.2",
    "tree-sitter-python==0.25.0",
    "rerankers==0.10.0",
    "torch==2.5.1",
    "pylance==7.0.0",
    "transformers==5.12.1",
    "sentencepiece==0.2.1",
    "safetensors==0.8.0",
    "regex==2026.5.9",
    "fastmcp==3.4.2",
    "pydantic-settings==2.14.1",
    "sentence-transformers==5.6.0",
]

[project.urls]
Repository = "https://github.com/leo-kleis/rag-local"

[project.scripts]
rag-query = "rag_local.cli.query:main"
rag-ingest = "rag_local.cli.ingest:main"
rag-mcp = "rag_local.mcp:main"
rag-project-map = "rag_local.cli.project_map:main"
rag-graph = "rag_local.cli.graph:main"
rag-styles = "rag_local.cli.styles:main"
rag-loc = "rag_local.cli.metrics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_local"]

# ── Ruff ────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "tests",
    "dist",
    "build",
    ".lancedb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (ordenamiento de imports)
    "B",   # flake8-bugbear (errores comunes)
    "UP",  # pyupgrade (modernización de sintaxis)
    "SIM", # flake8-simplify (simplificaciones)
    "S",   # flake8-bandit (análisis de seguridad)
    "T20", # flake8-print (prohibir print)
    "N",   # pep8-naming (estilo de nombres)
    "A",   # flake8-builtins (evitar sobreescribir builtins)
    "C4",  # flake8-comprehensions (simplificar comprensiones)
    "RUF", # ruff-specific rules (reglas específicas de ruff)
]
ignore = [
    "A001", # Permitir shadowing de builtins
    "S311", # Permitir random estándar (no criptográfico)
]
fixable = ["ALL"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ── Pyrefly ─────────────────────────────────────────────────────────

[tool.pyrefly]
preset = "default"
project-includes = ["src/rag_local/**/*.py"]
project-excludes = [
    ".venv/**",
    "**/.venv/**",
    "**/site-packages/**",
    "**/node_modules/**",
    "**/.git/**",
    "**/__pycache__/**",
    "**/__pyrefly_virtual__/**",
    "**/tests/**",
    "dist/**",
    "build/**",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
    "pyrefly==1.0.0",
    "pytest==9.1.0",
    "bump-my-version==1.4.1",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

# ── Pytest ──────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:builtin type SwigPy.* has no __module__ attribute:DeprecationWarning",
]

[tool.bumpversion]
current_version = "0.5.1"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore: release v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
